apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: policylens-ingress
  namespace: policylens
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  tls:
    - hosts:
        - api.policylens.ai
        - app.policylens.ai
      secretName: policylens-tls-cert
  rules:
    - host: api.policylens.ai
      http:
        paths:
          - path: /api/ai
            pathType: Prefix
            backend:
              service:
                name: backend-api
                port:
                  number: 5000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-api
                port:
                  number: 5000
    - host: app.policylens.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-web
                port:
                  number: 80
---
# Secrets Store CSI Driver Provider (Mounting AWS Secrets Manager directly into Kubernetes Pods)
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aws-secrets-provider
  namespace: policylens
spec:
  provider: aws
  secretObjects:
    - secretName: policylens-vault-secrets
      type: Opaque
      data:
        - objectName: DATABASE_URL
          key: DATABASE_URL
        - objectName: JWT_SECRET
          key: JWT_SECRET
        - objectName: JWT_REFRESH_SECRET
          key: JWT_REFRESH_SECRET
        - objectName: INTERNAL_API_SECRET
          key: INTERNAL_API_SECRET
        - objectName: GEMINI_API_KEY
          key: GEMINI_API_KEY
  parameters:
    objects: |
      - objectName: "policylens/production/app-secrets"
        objectType: "secretsmanager"
